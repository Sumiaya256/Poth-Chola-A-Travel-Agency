<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Review Page</title>
<style>
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 50px;
  }

  /* Header */
  header {
    background: #1c5dcd;
    color: #fff;
    text-align: center;
    padding: 80px 20px 60px;
    border-bottom-left-radius: 50px;
    border-bottom-right-radius: 50px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }
  header h1 {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 1px;
  }
  header h4 {
  margin: 0;
  text-align: right;
  
}

header a {
  color: white;               
  text-decoration: none;
  font-weight: bold;

  
}


  
  #avgRating {
    text-align: center;
    margin: 30px auto;
    font-size: 1.6rem;
    font-weight: 600;
    color: #1c5dcd;
  }

  /* Form */
  form {
    background: #ffffff;
    padding: 35px 40px;
    max-width: 700px;
    margin: 0 auto 60px;
    border-radius: 20px;
    border: 1px solid #d1d9e6;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
   transition: all 0.3s ease;
  }
  form:hover {
    transform: translateY(-5px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.12);
  }

  /* Stars */
  .stars {
    display:flex;
    justify-content: center;
    margin-bottom: 25px;
  }
  .stars input { display: none; }
  .stars label {
    font-size: 2.4rem;
    color: #cbd5e1;
    cursor: pointer;
    transition: all 0.25s ease;
    margin: 0 5px;
  }
  .stars input:checked ~ label,
  .stars label:hover,
  .stars label:hover ~ label {
    color: #facc15;
    transform: scale(1.3);
  }

  /* Inputs */
  input[type="text"], textarea {
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease;
    background: #f9fafb;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: #1c5dcd;
    box-shadow: 0 0 15px rgba(28,93,205,0.2);
  }

  /* Button */
  button {
    width: 100%;
    padding: 12px ;
    margin-bottom: 12px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg, #1c5dcd, #1998cf);
    color: #fff;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
  button:hover {
    background: linear-gradient(90deg, #1548a6, #1274b1);
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
  }

  /* Reviews Grid */
  #reviewsList {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
    padding: 0 20px;
  }
  #reviewsList h2 {
    grid-column: 1 / -1;
    text-align: center;
    margin-bottom: 30px;
    font-size: 2rem;
    color: #1c5dcd;
    font-weight: 700;
  }

  .review {
    background: #ffffff;
    border-radius: 16px;
    padding: 25px 30px;
    border: 1px solid #d1d9e6;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    transition: all 0.3s ease;
  }
  .review:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.1);
  }
  .review .stars { color: #facc15; font-size: 1.3rem; margin-bottom: 10px; }
  .review .user { font-weight: 700; color: #1f2937; margin-bottom: 3px; }
  .review .date { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
  .review .text { font-size: 1rem; line-height: 1.6; color: #334155; }

  /* Responsive */
  @media (max-width: 640px) {
    header h1 { font-size: 2rem; }
    .stars label { font-size: 2rem; }
    input, textarea { font-size: 0.95rem; padding: 14px 16px; }
    button { font-size: 1rem; padding: 14px; }
    #reviewsList h2 { font-size: 1.6rem; }
  }

  
</style>
</head>
<body>
 
<header>
  <h4><a href="index.html">Home</a></h4>
  <h1>Share Your Experience</h1>
</header>



<div id="avgRating">⭐ 0.0 based on 0 reviews</div>

<form id="reviewForm">
  <div class="stars">
    <input type="radio" name="rating" id="star1" value="1"><label for="star1">⭐</label>
    <input type="radio" name="rating" id="star2" value="2"><label for="star2">⭐</label>
    <input type="radio" name="rating" id="star3" value="3"><label for="star3">⭐</label>
    <input type="radio" name="rating" id="star4" value="4"><label for="star4">⭐</label>
    <input type="radio" name="rating" id="star5" value="5"><label for="star5">⭐</label>
  </div>
  <input type="text" id="userName" placeholder="Your Name">
  <textarea id="reviewText" placeholder="Write your review..." rows="4"></textarea>
  <button type="submit">Submit Review</button>
</form>

<div id="reviewsList">
  <h2>User Reviews</h2>
</div>

<script src="revieww.js"></script>
</body>
</html>

<div class="auth-buttons">

    </div>

<section class="hero-slider">

  <script>
  let currentSlide = 0;
  const slides = document.querySelectorAll(".slide");

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.classList.remove("active");
      if (i === index) {
        slide.classList.add("active");
      }
    });
  }

  function moveSlide(step) {
    currentSlide += step;
    if (currentSlide >= slides.length) currentSlide = 0;
    if (currentSlide < 0) currentSlide = slides.length - 1;
    showSlide(currentSlide);
  }

 
  showSlide(currentSlide);
</script>
<script>
  
  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem("currentUser")); } catch { return null; }
  }

  (function setupReviewsLink() {
    const link = document.getElementById("reviewsLink");
    if (!link) return; // no button found

    const u = getCurrentUser();
    if (u && u.fullName) {
      
      link.href = "revieww.html?name=" + encodeURIComponent(u.fullName);
    } else {
     
      link.href = "revieww.html";
    }
  })();
</script>


<script>
  (function () {
    function getCurrentUser() {
      try { return JSON.parse(localStorage.getItem('currentUser')); } catch { return null; }
    }

    const signInA = document.getElementById('navSignIn');
    const signUpA = document.getElementById('navSignUp');
    const reviewsNav = document.getElementById('reviewsNav');

    function renderHeader() {
      const u = getCurrentUser();

   
      if (reviewsNav) {
        reviewsNav.href = u && u.fullName
          ? 'revieww.html?name=' + encodeURIComponent(u.fullName)
          : 'revieww.html';
      }

      
      if (u && u.fullName) {
       
        if (signInA) {
          signInA.textContent = 'Profile';
          signInA.href = 'userProfile.html';
        }
        if (signUpA) {
          signUpA.textContent = 'Reviews';
          signUpA.href = 'revieww.html?name=' + encodeURIComponent(u.fullName);
         
        }
      } else {
       
        if (signInA) {
          signInA.textContent = 'Sign In';
          signInA.href = 'user.html?mode=signin';
        }
        if (signUpA) {
          signUpA.textContent = 'Sign Up';
          signUpA.href = 'user.html?mode=signup';
        }
      }
    }

    renderHeader();
    
    window.addEventListener('storage', (e) => { if (e.key === 'currentUser') renderHeader(); });
  })();
</script>



</body>
</html>
